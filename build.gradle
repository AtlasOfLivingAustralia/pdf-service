buildscript {
    ext {
        kotlinVersion = '1.9.23'
    }
    repositories {
        jcenter()
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'se.transmode.gradle:gradle-docker:1.2'
    }
}

plugins {
    id("com.gradleup.shadow") version "9.2.2"
}
apply plugin: 'application'
apply plugin: 'docker'

allprojects {
    apply plugin: 'java'
    apply plugin: 'kotlin'
    ext {
        dropwizardVersion = '1.3.22'
    }
    group = 'au.org.ala'
    version = '1.3'
    sourceCompatibility = 11

    repositories {
        jcenter()
        mavenLocal()
        mavenCentral()
    }

    dependencies {
        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
        implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlinVersion"
        implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.11.+"
    }
  
}

project(':pdfgen-application') {
    dependencies {
        implementation "io.dropwizard:dropwizard-core:$dropwizardVersion"
        implementation "io.dropwizard:dropwizard-client:$dropwizardVersion"
        implementation "io.dropwizard:dropwizard-forms:$dropwizardVersion"

        testImplementation("org.junit.jupiter:junit-jupiter-api:5.7.2")
        testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.7.2")
        testImplementation("org.junit.jupiter:junit-jupiter-params:5.7.2")
        testImplementation('org.mockito:mockito-core:3.7.7')
    }
    test {
        useJUnitPlatform()
    }
}



mainClassName = 'au.org.ala.PdfGen'

def devconfig = 'devconfig.yml'

run { args 'server', devconfig }

dependencies {
    implementation project(':pdfgen-application')
}

shadowJar {
    exclude 'LICENSE'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    mergeServiceFiles()
}

apply plugin:"maven-publish"

publishing {
    repositories {
        maven {
            name 'Nexus'
            url "https://nexus.ala.org.au/content/repositories/${project.version.endsWith('-SNAPSHOT') ? 'snapshots' : 'releases' }"
            credentials {
                username = System.getenv('TRAVIS_DEPLOY_USERNAME')
                password = System.getenv('TRAVIS_DEPLOY_PASSWORD')
            }
        }
    }
    publications {
        mavenJar(MavenPublication) {

            def shadowFile = file("$buildDir/libs/$project.name-$project.version-all.jar")
            if (shadowFile.exists()) {
                artifact(shadowFile) {
                    classifier 'all'
                }
            }
        }
    }
}


docker {
    baseImage "phusion/baseimage:0.9.22"
    maintainer 'Simon Bear "simon.bear@csiro.au"'
}

task loDocker(type: Docker) {
    applicationName "libreoffice"
    tagVersion "5.0"
    runCommand 'add-apt-repository -y ppa:libreoffice/ppa'
    runCommand 'DEBIAN_FRONTEND=noninteractive apt-get update'
    runCommand 'DEBIAN_FRONTEND=noninteractive apt-get install -y libreoffice unoconv fonts-dejavu fonts-sil-gentium-basic fonts-sil-gentium fonts-liberation --no-install-recommends --no-install-suggests'
    runCommand 'apt-get clean && rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*'
}

task pdfgenDocker(type: Docker) {
    dependsOn 'shadowJar', 'loDocker'
    baseImage 'au.org.ala/libreoffice:5.0'
    applicationName "pdfgen"
    defaultCommand = ['/sbin/my_init']
    exposePort 9090
    runCommand 'DEBIAN_FRONTEND=noninteractive apt-get update'
    runCommand 'DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-8-jre-headless xz-utils'
    runCommand 'apt-get clean && rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*'
    runCommand 'mkdir -p /opt/wkhtmltopdf-0.12.4'
    runCommand 'curl -L https://github.com/wkhtmltopdf/wkhtmltopdf/releases/download/0.12.4/wkhtmltox-0.12.4_linux-generic-amd64.tar.xz > ./wkhtmltox-0.12.4_linux-generic-amd64.tar.xz'
    runCommand 'tar xf wkhtmltox-0.12.4_linux-generic-amd64.tar.xz -C /opt/wkhtmltopdf-0.12.4'
    runCommand 'rm wkhtmltox-0.12.4_linux-generic-amd64.tar.xz'
    runCommand 'ln -s /opt/wkhtmltopdf-0.12.4/wkhtmltox/bin/wkhtmltopdf /usr/bin/wkhtmltopdf'
    runCommand 'useradd -r -s /bin/false -m pdfgen'
    runCommand 'mkdir -p /storage/pdfs'
    runCommand 'chown pdfgen /storage/pdfs'
    volume '/storage'
    runCommand 'mkdir /etc/service/pdfgen'
    addFile 'image/pdfgen.sh', '/etc/service/pdfgen/run'
    runCommand 'mkdir -p /opt/pdfgen'
    runCommand 'mkdir -p /etc/pdfgen'
    addFile 'image/config.yml', '/etc/pdfgen/config.yml'
    addFile "build/libs/pdfgen-$version-all.jar", '/opt/pdfgen/pdfgen.jar'
}
